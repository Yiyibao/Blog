name: Deploy

# CD (Phase 2): tag/manual trigger + GitHub Environment approval gate.
# Prerequisites:
#   1. Server: deploy user with sudo (systemctl restart yubai-blog) and write
#      access to APP_DIR/releases/ and APP_DIR/current.
#   2. nginx (www-data) needs o+x on APP_DIR and o+rx on releases/ (see
#      bootstrap-server.sh "minimum safe bootstrap" layout).
#   3. GitHub repo Settings → Environments → "production" with Required reviewers.
#   4. Secrets: DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH.
#   5. Repository variable (Settings → Actions → Variables): PRERENDER_API_BASE_URL.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax checks
        run: |
          bash -n deploy/bootstrap-server.sh
      - name: Structural assertions
        run: |
          grep -qF 'ExecStart=/usr/bin/java -Xms128m -Xmx768m -XX:+UseG1GC -jar /opt/yubai-blog/current/backend/blog-backend.jar' deploy/yubai-blog.service
          grep -qF 'ReadWritePaths=/opt/yubai-blog/shared/attachments' deploy/yubai-blog.service
          grep -qF 'root /opt/yubai-blog/current/frontend/client;' deploy/hxnf.top.nginx
          node -e "const c=require('./deploy/opencode.json'); const a=c.agent?.['blog-ai']; if (!a || Object.hasOwn(a, 'steps') || a.permission !== 'deny') process.exit(1)"

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run test:typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_AI_PLATFORM_ENABLED: 'true'
          PRERENDER_REQUIRE_DYNAMIC: 'true'
          PRERENDER_API_BASE_URL: ${{ vars.PRERENDER_API_BASE_URL }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Package backend (with tests)
        working-directory: backend
        run: mvn --batch-mode package

      - name: Stage canonical jar
        run: |
          jar=$(ls backend/target/*.jar 2>/dev/null | head -1)
          if [ -z "$jar" ]; then echo "no jar found" >&2; exit 1; fi
          mkdir -p backend/target/canonical
          cp "$jar" backend/target/canonical/blog-backend.jar

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/canonical/blog-backend.jar
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Approval gate: Environment "production" with Required reviewers
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/frontend

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: dist/backend

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          release="release-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          archive_path="$RUNNER_TEMP/release-${GITHUB_SHA::7}.tar.gz"
          archive_name="$(basename "$archive_path")"
          release_tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            release_tag="deploy-${GITHUB_RUN_ID}"
          fi
          tar -C dist -czf "$archive_path" .
          echo "RELEASE_DIR=$release" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Publish release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "Production deployment archive for $GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" "$ARCHIVE_PATH" --repo "$GITHUB_REPOSITORY" --clobber

      # Remote script — args passed positionally (runner env vars not inherited by SSH)
      - name: Atomic switch, restart, health check with rollback
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s "$DEPLOY_PATH" "$RELEASE_DIR" "$RELEASE_TAG" "$ARCHIVE_NAME" "$GITHUB_REPOSITORY" <<'EOF'
          set -euo pipefail
          DEPLOY_PATH="$1"
          RELEASE_DIR="$2"
          RELEASE_TAG="$3"
          ARCHIVE_NAME="$4"
          GITHUB_REPOSITORY="$5"
          ARCHIVE_PATH="${DEPLOY_PATH}/releases/${ARCHIVE_NAME}"
          RELEASE_PATH="${DEPLOY_PATH}/releases/${RELEASE_DIR}"
          ARCHIVE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ARCHIVE_NAME}"

          mkdir -p "$RELEASE_PATH"
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 900 \
            "$ARCHIVE_URL" -o "$ARCHIVE_PATH"
          tar -xzf "$ARCHIVE_PATH" -C "$RELEASE_PATH"
          rm -f "$ARCHIVE_PATH"

          # Ensure nginx (www-data) can traverse and read frontend files
          find "$RELEASE_PATH" -type d -exec chmod o+rx {} +
          find "$RELEASE_PATH" -type f -exec chmod o+r {} +

          OLD_TARGET=$(readlink "${DEPLOY_PATH}/current" 2>/dev/null || echo "")

          ln -sfn "releases/${RELEASE_DIR}" "${DEPLOY_PATH}/current.next" \
            && mv -T "${DEPLOY_PATH}/current.next" "${DEPLOY_PATH}/current"

          FAILED=false
          sudo systemctl restart yubai-blog || FAILED=true

          if [ "$FAILED" = false ]; then
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8080/actuator/health | grep -q '"UP"'; then
                echo "health check passed"
                # Historical releases may be owned by root/yubai. Restrict
                # cleanup to generated release names, then use the deployment
                # account's narrowly granted sudo capability.
                ls -1t "${DEPLOY_PATH}/releases" | tail -n +6 | while IFS= read -r old_release; do
                  case "$old_release" in
                    release-*) sudo rm -rf -- "${DEPLOY_PATH}/releases/${old_release}" ;;
                    *) echo "Skipping unexpected release entry: ${old_release}" >&2 ;;
                  esac
                done
                exit 0
              fi
              sleep 2
            done
            echo "health check FAILED after 60s" >&2
            FAILED=true
          fi

          # Single rollback path — entered on restart failure or health timeout
          if [ -n "$OLD_TARGET" ]; then
            echo "Rolling back to ${OLD_TARGET}..." >&2
            if ln -sfn "$OLD_TARGET" "${DEPLOY_PATH}/current.next" && mv -T "${DEPLOY_PATH}/current.next" "${DEPLOY_PATH}/current"; then
              sudo systemctl restart yubai-blog || true
              sleep 5
              if curl -sf http://127.0.0.1:8080/actuator/health | grep -q '"UP"'; then
                echo "Rollback succeeded, previous release is running" >&2
              else
                echo "Rollback also FAILED — manual intervention required" >&2
              fi
            else
              echo "FATAL: Rollback symlink restoration FAILED — manual intervention required" >&2
            fi
          else
            echo "No previous current to roll back to" >&2
          fi

          exit 1
          EOF
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_DIR: ${{ env.RELEASE_DIR }}
