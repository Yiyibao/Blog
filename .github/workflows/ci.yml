name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:types:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run test:typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e:offline
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      # P2-6：运行时（生产）依赖漏洞保持阻塞门槛
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies
        run: npm audit --audit-level=high

  # M4：online E2E 必须明确指向已启动的全栈测试环境，不能把 preview shell 当成在线验收。
  # 未配置环境变量时保持未启用，而不是把缺少后端的测试标成通过；M7 提供 CI 隔离全栈启动器。
  online-e2e:
    if: ${{ vars.E2E_BASE_URL != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e:online

  # M7：隔离 PostgreSQL + 本地后端/前端 + deterministic fake Responses provider。
  # 不读取生产凭据；关键路径失败直接阻断，并保留 provider 请求、后端日志和 Playwright trace。
  full-stack-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yubai_blog_e2e
          POSTGRES_USER: yubai_app
          POSTGRES_PASSWORD: e2e-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yubai_app -d yubai_blog_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build backend artifact
        working-directory: backend
        run: mvn --batch-mode -DskipTests -Dmaven.javadoc.skip=true package
      - name: Run isolated full-stack E2E
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/yubai_blog_e2e
          DB_USERNAME: yubai_app
          DB_PASSWORD: e2e-only-password
          APP_JWT_SECRET: e2e-only-jwt-secret-key-32-characters
          APP_JWT_COOKIE_SECURE: "false"
          APP_ADMIN_USERNAME: admin
          APP_ADMIN_PASSWORD: admin-pass-12345
          APP_ADMIN_DISPLAY_NAME: E2E Admin
          APP_PARTNER_USERNAME: partner
          APP_PARTNER_PASSWORD: partner-pass-12345
          APP_PARTNER_DISPLAY_NAME: E2E Partner
          APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
          APP_SITE_URL: http://127.0.0.1:4173
          APP_AI_MASTER_KEY: e2e-only-master-key-32-characters
          APP_AI_ALLOW_LOCAL_ENDPOINTS: "true"
          APP_AI_PLATFORM_TASKS_ENABLED: "true"
          APP_AI_PLATFORM_MULTIMODAL_ENABLED: "true"
          APP_AI_PLATFORM_MEMORY_ENABLED: "true"
          APP_AI_PLATFORM_ARTIFACTS_ENABLED: "true"
          APP_ATTACHMENT_STORAGE_DIR: ${{ runner.temp }}/blogdemo-attachments
          FAKE_PROVIDER_LOG: ${{ runner.temp }}/fake-provider.log
          FAKE_PROVIDER_PORT: "8787"
        shell: bash
        run: |
          npx playwright install --with-deps chromium firefox
          node scripts/run-full-stack-e2e.mjs
      - name: Upload full-stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-e2e-evidence
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
            ${{ runner.temp }}/fake-provider.log
            ${{ runner.temp }}/fake-provider.stdout.log
            frontend/test-results
            frontend/playwright-report

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # P2-4：不再手工配置 PostgreSQL service——集成测试经 Testcontainers 自起容器
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run tests
        run: mvn --batch-mode verify 2>&1 | tee test-output.log
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/test-output.log
      # P2-5：JaCoCo 覆盖率报告随构建产出（阈值基线见计划书 6C，只升不降）
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable migrations and release scripts
        shell: bash
        run: |
          node scripts/verify-migration-manifest.mjs
          bash -n deploy/yubai-blog-backup
          bash -n deploy/release-preflight.sh
          if grep -q 'ssh-keyscan' .github/workflows/deploy.yml; then
            echo 'Dynamic SSH host-key discovery is forbidden' >&2
            exit 1
          fi
      - name: Parse PowerShell release-safety scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/migration-preflight.ps1),
            [ref]$null,
            [ref]$parseErrors
          ) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/restore-and-migrate-drill.ps1),
            [ref]$null,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors -join "`n") }
      - name: Check whitespace and conflict markers
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_sha="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
            git diff --check "$base_sha"..HEAD
          else
            # D-11：push 检查整个推送区间（event.before..HEAD），不再只看最后一笔
            before="${{ github.event.before }}"
            if [[ -n "$before" && ! "$before" =~ ^0+$ ]] && git cat-file -e "$before" 2>/dev/null; then
              git diff --check "$before"..HEAD
            elif git rev-parse HEAD~1 &>/dev/null; then
              git diff --check HEAD~1
            else
              echo "Initial commit — no parent to compare."
            fi
          fi
