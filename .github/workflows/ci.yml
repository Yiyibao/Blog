name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:types:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run test:typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      # P2-6：运行时（生产）依赖漏洞保持阻塞门槛
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies
        run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # P2-4：不再手工配置 PostgreSQL service——集成测试经 Testcontainers 自起容器
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run tests
        run: mvn --batch-mode verify 2>&1 | tee test-output.log
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/test-output.log
      # P2-5：JaCoCo 覆盖率报告随构建产出（阈值基线见计划书 6C，只升不降）
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace and conflict markers
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_sha="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
            git diff --check "$base_sha"..HEAD
          else
            # D-11：push 检查整个推送区间（event.before..HEAD），不再只看最后一笔
            before="${{ github.event.before }}"
            if [[ -n "$before" && ! "$before" =~ ^0+$ ]] && git cat-file -e "$before" 2>/dev/null; then
              git diff --check "$before"..HEAD
            elif git rev-parse HEAD~1 &>/dev/null; then
              git diff --check HEAD~1
            else
              echo "Initial commit — no parent to compare."
            fi
          fi
