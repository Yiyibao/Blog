name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:typecheck
      - run: npm run build
      # P2-6：运行时（生产）依赖漏洞保持阻塞门槛
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # P2-6：完整审计降为非阻塞记录——12 个 high 全部来自测试/构建链的
      # brace-expansion 传递依赖（minimatch→glob→workbox-build→vite-plugin-pwa），
      # 上游修复后恢复阻塞（每月复查，见 v5 计划 6F）
      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yubai_blog_it
          POSTGRES_USER: yubai_app
          POSTGRES_PASSWORD: ci-test-password
        options: >-
          --health-cmd "pg_isready -U yubai_app -d yubai_blog_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run tests
        run: mvn --batch-mode test 2>&1 | tee test-output.log
        env:
          DB_URL: jdbc:postgresql://localhost:5432/yubai_blog_it
          DB_USERNAME: yubai_app
          DB_PASSWORD: ci-test-password
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/test-output.log
      # P2-5：JaCoCo 覆盖率报告随构建产出（阈值基线见计划书 6C，只升不降）
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace and conflict markers
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_sha="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
            git diff --check "$base_sha"..HEAD
          else
            # D-11：push 检查整个推送区间（event.before..HEAD），不再只看最后一笔
            before="${{ github.event.before }}"
            if [[ -n "$before" && ! "$before" =~ ^0+$ ]] && git cat-file -e "$before" 2>/dev/null; then
              git diff --check "$before"..HEAD
            elif git rev-parse HEAD~1 &>/dev/null; then
              git diff --check HEAD~1
            else
              echo "Initial commit — no parent to compare."
            fi
          fi
