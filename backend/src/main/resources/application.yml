spring:
  application:
    name: yubai-blog-backend
  config:
    import: optional:file:.env.properties
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yubai_blog}
    username: ${DB_USERNAME:yubai_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  site-url: ${APP_SITE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${APP_JWT_SECRET}
    ttl: ${APP_JWT_TTL:PT2H}
  auth:
    challenge:
      # L-7：登录人机验证三层参数；难度每 +1 前端 PoW 平均计算量 ×16
      pow-difficulty: ${APP_AUTH_POW_DIFFICULTY:4}
      ttl: ${APP_AUTH_CHALLENGE_TTL:PT5M}
      captcha-threshold: ${APP_AUTH_CAPTCHA_THRESHOLD:3}
      cooldown-threshold: ${APP_AUTH_COOLDOWN_THRESHOLD:10}
      failure-window: ${APP_AUTH_FAILURE_WINDOW:PT15M}
      cooldown-duration: ${APP_AUTH_COOLDOWN_DURATION:PT30M}
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    master-key: ${APP_AI_MASTER_KEY:}
    allow-local-endpoints: ${APP_AI_ALLOW_LOCAL_ENDPOINTS:false}
    model: ${AI_MODEL:deepseek-v4-flash}
    request-timeout: ${AI_REQUEST_TIMEOUT:60}
    max-input-chars: ${AI_MAX_INPUT_CHARS:8000}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:20}
    max-total-chars: ${AI_MAX_TOTAL_CHARS:40000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
