spring:
  application:
    name: yubai-blog-backend
  config:
    import: optional:file:.env.properties
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yubai_blog}
    username: ${DB_USERNAME:yubai_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# P2-3：API 文档默认关闭——本地开发在 .env.properties 设 SPRINGDOC_ENABLED=true 后访问 /swagger-ui.html
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # 6A：探针仅需 UP/DOWN，不泄露数据库、磁盘等详情
      show-details: never
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  site-url: ${APP_SITE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${APP_JWT_SECRET}
    ttl: ${APP_JWT_TTL:PT2H}
    # FD-9："保持登录"勾选时的 TTL；刻意不给 7 天——踢下线靠 sessions_valid_from
    remember-ttl: ${APP_JWT_REMEMBER_TTL:PT24H}
    # 6C-1：refresh token 过期时间（短短期 access token + 长寿命 HttpOnly cookie 配合）
    refresh-ttl: ${APP_JWT_REFRESH_TTL:P7D}
    refresh-remember-ttl: ${APP_JWT_REFRESH_REMEMBER_TTL:P30D}
    cookie-secure: ${APP_JWT_COOKIE_SECURE:true}
  auth:
    challenge:
      # L-7：登录人机验证三层参数；难度每 +1 前端 PoW 平均计算量 ×16
      pow-difficulty: ${APP_AUTH_POW_DIFFICULTY:4}
      ttl: ${APP_AUTH_CHALLENGE_TTL:PT5M}
      captcha-threshold: ${APP_AUTH_CAPTCHA_THRESHOLD:3}
      cooldown-threshold: ${APP_AUTH_COOLDOWN_THRESHOLD:10}
      failure-window: ${APP_AUTH_FAILURE_WINDOW:PT15M}
      cooldown-duration: ${APP_AUTH_COOLDOWN_DURATION:PT30M}
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
    display-name: ${APP_ADMIN_DISPLAY_NAME:}
  # FD-6：伴侣账号（PARTNER 角色）——只建不改，未配置则跳过
  partner:
    username: ${APP_PARTNER_USERNAME:}
    password: ${APP_PARTNER_PASSWORD:}
    display-name: ${APP_PARTNER_DISPLAY_NAME:}
  attachment:
    storage:
      dir: ${APP_ATTACHMENT_STORAGE_DIR:./data/attachments}
  recipe:
    # P1-15：食谱导入大小限制（服务层按需校验，全局 multipart 25MB 为上限兜底）
    max-compressed-size: ${APP_RECIPE_MAX_COMPRESSED_SIZE:25MB}
    max-uncompressed-total: ${APP_RECIPE_MAX_UNCOMPRESSED_TOTAL:40MB}
    max-entry-size: ${APP_RECIPE_MAX_ENTRY_SIZE:10MB}
    extraction:
      video-enabled: ${APP_RECIPE_VIDEO_ENABLED:true}
      yt-dlp-path: ${APP_RECIPE_YT_DLP_PATH:yt-dlp}
      video-timeout: ${APP_RECIPE_VIDEO_TIMEOUT:PT45S}
      max-transcript-chars: ${APP_RECIPE_MAX_TRANSCRIPT_CHARS:25000}
      video-hosts: ${APP_RECIPE_VIDEO_HOSTS:youtube.com,youtu.be,bilibili.com,b23.tv,douyin.com,iesdouyin.com,xiaohongshu.com,xhslink.com}

  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    # Native Anthropic Messages API configuration. Keep the token in the service
    # environment; it is never committed to the repository or written to logs.
    anthropic-base-url: ${ANTHROPIC_BASE_URL:}
    anthropic-auth-token: ${ANTHROPIC_AUTH_TOKEN:}
    anthropic-model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    anthropic-models: ${ANTHROPIC_MODELS:claude-fable-5,claude-haiku-4-5,claude-haiku-4-5-20251001,claude-opus-4-6,claude-opus-4-7,claude-opus-4-8,claude-opus-5,claude-sonnet-4-6,claude-sonnet-5}
    responses-enabled: ${APP_AI_RESPONSES_ENABLED:false}
    responses-base-url: ${APP_AI_RESPONSES_BASE_URL:}
    responses-api-key: ${APP_AI_RESPONSES_API_KEY:}
    responses-model: ${APP_AI_RESPONSES_MODEL:gpt-5.5}
    responses-models: ${APP_AI_RESPONSES_MODELS:gpt-5.3-codex-spark,gpt-5.4,gpt-5.5,gpt-5.6-luna,gpt-5.6-sol,gpt-5.6-terra}
    responses-header-name: ${APP_AI_RESPONSES_HEADER_NAME:}
    responses-header-value: ${APP_AI_RESPONSES_HEADER_VALUE:}
    responses-reasoning-effort: ${APP_AI_RESPONSES_REASONING_EFFORT:xhigh}
    responses-store: ${APP_AI_RESPONSES_STORE:false}
    master-key: ${APP_AI_MASTER_KEY:}
    allow-local-endpoints: ${APP_AI_ALLOW_LOCAL_ENDPOINTS:false}
    model: ${AI_MODEL:deepseek-v4-flash}
    request-timeout: ${AI_REQUEST_TIMEOUT:60}
    max-input-chars: ${AI_MAX_INPUT_CHARS:32000}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:20}
    max-total-chars: ${AI_MAX_TOTAL_CHARS:160000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
    opencode-username: ${APP_AI_OPENCODE_USERNAME:}
    opencode-password: ${APP_AI_OPENCODE_PASSWORD:}
    opencode-agent: ${APP_AI_OPENCODE_AGENT:blog-ai}
    opencode-provider-id: ${APP_AI_OPENCODE_PROVIDER_ID:opencode-go}
    image:
      enabled: ${AI_IMAGE_ENABLED:false}
      max-prompt-chars: ${AI_IMAGE_MAX_PROMPT_CHARS:32000}
      max-images: ${AI_IMAGE_MAX_IMAGES:1}
      max-image-bytes: ${AI_IMAGE_MAX_BYTES:15000000}
      request-timeout: ${AI_IMAGE_REQUEST_TIMEOUT:120}
      rate-limit: ${AI_IMAGE_RATE_LIMIT:3}
      rate-window-seconds: ${AI_IMAGE_RATE_WINDOW_SECONDS:60}
      grok:
        enabled: ${AI_IMAGE_GROK_ENABLED:false}
        base-url: ${AI_IMAGE_GROK_BASE_URL:}
        api-key: ${AI_IMAGE_GROK_API_KEY:}
        models: ${AI_IMAGE_GROK_MODELS:grok-imagine-image}
        default-model: ${AI_IMAGE_GROK_MODEL:grok-imagine-image}
        wire-api: ${AI_IMAGE_GROK_WIRE_API:images}
      gpt:
        enabled: ${AI_IMAGE_GPT_ENABLED:false}
        base-url: ${AI_IMAGE_GPT_BASE_URL:}
        api-key: ${AI_IMAGE_GPT_API_KEY:}
        models: ${AI_IMAGE_GPT_MODELS:gpt-image-2}
        default-model: ${AI_IMAGE_GPT_MODEL:gpt-image-2}
        wire-api: ${AI_IMAGE_GPT_WIRE_API:images}
        header-name: ${AI_IMAGE_GPT_HEADER_NAME:x-openai-actor-authorization}
        header-value: ${AI_IMAGE_GPT_HEADER_VALUE:local-image-extension}
